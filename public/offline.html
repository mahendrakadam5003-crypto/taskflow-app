<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B33">
  <title>TaskFlow | No connection</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background: #0F1B33; color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 340px; }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: #16253f; border: 1px solid #23375a;
    }
    svg { width: 36px; height: 36px; stroke: #62c4a5; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #9fb0cf; line-height: 1.5; font-size: 15px; }
    button {
      width: 100%; padding: 14px 20px; border: 0; border-radius: 12px;
      background: #62c4a5; color: #0b2a22; font: inherit; font-weight: 700; font-size: 16px;
    }
    button[disabled] { opacity: .6; }
    #status { margin: 14px 0 0; min-height: 20px; font-size: 14px; color: #9fb0cf; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>TaskFlow needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button id="retry" type="button">Try again</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    var APP_URL = 'https://taskflow-app-zjlw.onrender.com/app';
    var button = document.getElementById('retry');
    var status = document.getElementById('status');
    var checking = false;

    function retry() {
      if (checking) return;
      checking = true;
      button.disabled = true;
      status.textContent = 'Checking connection...';
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 15000);
      fetch(APP_URL, { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
        .then(function () { window.location.replace(APP_URL); })
        .catch(function () {
          status.textContent = 'Still no connection. Please try again.';
          checking = false;
          button.disabled = false;
        })
        .then(function () { clearTimeout(timer); });
    }

    button.addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
