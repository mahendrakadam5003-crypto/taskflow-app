<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1B33">
  <title>TaskFlow | Connecting</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background: #0F1B33; color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 340px; }
    .icon {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: #16253f; border: 1px solid #23375a;
    }
    svg { width: 36px; height: 36px; stroke: #62c4a5; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #9fb0cf; line-height: 1.5; font-size: 15px; }
    button {
      width: 100%; padding: 14px 20px; border: 0; border-radius: 12px;
      background: #62c4a5; color: #0b2a22; font: inherit; font-weight: 700; font-size: 16px;
    }
    button[disabled] { opacity: .6; }
    #status { margin: 14px 0 0; min-height: 20px; font-size: 14px; color: #9fb0cf; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #23375a; border-top-color: #62c4a5; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/><path d="M3 3l18 18"/></svg>
    </div>
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="title">Connecting…</h1>
    <p id="message">TaskFlow is waking up the server. This can take up to a minute the first time. We'll keep trying automatically.</p>
    <button id="retry" type="button">Try again now</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    var APP_URL = 'https://taskflow-app-zjlw.onrender.com/app';
    var button = document.getElementById('retry');
    var status = document.getElementById('status');
    var title = document.getElementById('title');
    var message = document.getElementById('message');
    var attempts = 0;
    var checking = false;
    var nextTimer = null;

    function scheduleNext() {
      clearTimeout(nextTimer);
      // Back off gently: 4s, 6s, 8s ... up to 15s between automatic tries.
      var wait = Math.min(4000 + attempts * 2000, 15000);
      nextTimer = setTimeout(retry, wait);
    }

    function retry() {
      if (checking) return;
      checking = true;
      clearTimeout(nextTimer);
      button.disabled = true;
      attempts += 1;
      status.textContent = 'Attempt ' + attempts + '…';
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 20000);
      fetch(APP_URL, { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
        .then(function () { window.location.replace(APP_URL); })
        .catch(function () {
          title.textContent = 'Still connecting…';
          message.textContent = 'No response yet. Check that mobile data or Wi-Fi is on. We are still trying.';
          status.textContent = '';
          checking = false;
          button.disabled = false;
          scheduleNext();
        })
        .then(function () { clearTimeout(timer); });
    }

    button.addEventListener('click', retry);
    window.addEventListener('online', retry);
    retry();
  </script>
</body>
</html>
