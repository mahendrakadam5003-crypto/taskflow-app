<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14213D">
  <title>Reset your password | TaskFlow</title>
  <link rel="icon" href="/icons/taskflow.svg">
  <link rel="stylesheet" href="/css/account-auth.css">
  <script src="/js/auth-links.js" defer></script>
</head>
<body>
  <main class="account-card">
    <a class="brand" href="/"><img src="/icons/taskflow.svg" alt=""><span>TaskFlow</span></a>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Choose a new password</h1>
    <form id="password-reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <p id="account-status" role="status" aria-live="polite"></p>
      <button class="button" type="submit">Reset password</button>
    </form>
    <a id="account-login-link" class="account-login-link" href="/app">Return to sign in</a>
  </main>
</body>
</html>
