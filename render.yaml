services:
  - type: web
    name: taskflow-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SUPERADMIN_USERNAME
        value: super admin
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: TURSO_PLATFORM_TOKEN
        sync: false
      - key: TURSO_ORG
        sync: false
      - key: TURSO_GROUP
        value: default
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: MAIL_PROVIDER
        value: gmail
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_FROM
        sync: false
