workflows:
  capacitor-ios-build:
    name: TaskFlow iOS Simulator Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 20.18.0
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Sync Capacitor iOS project and CocoaPods
        script: npx cap sync ios
      - name: Build unsigned iOS Simulator app
        script: |
          xcodebuild \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$CM_BUILD_DIR/build/ios/derived/Build/Products/Release-iphonesimulator/App.app"
          test -d "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/build/ios"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$CM_BUILD_DIR/build/ios/TaskFlow-iOS-Simulator.app.zip"
    artifacts:
      - build/ios/TaskFlow-iOS-Simulator.app.zip
      - /tmp/xcodebuild_logs/**/*.log
