workflows:
  taskflow-capacitor-unsigned-ipa:
    name: TaskFlow Unsigned iOS Device Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 20.18.0
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Sync Capacitor iOS project and CocoaPods
        script: npx cap sync ios
      - name: Build unsigned iOS device archive
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios"
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_REQUIRED=NO \
            clean archive
          APP_PATH="$CM_BUILD_DIR/build/ios/App.xcarchive/Products/Applications/App.app"
          test -d "$APP_PATH"
      - name: Package unsigned IPA container
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios/Payload"
          cp -R "$CM_BUILD_DIR/build/ios/App.xcarchive/Products/Applications/App.app" "$CM_BUILD_DIR/build/ios/Payload/"
          cd "$CM_BUILD_DIR/build/ios"
          /usr/bin/zip -qry TaskFlow-unsigned.ipa Payload
    artifacts:
      - build/ios/TaskFlow-unsigned.ipa
      - /tmp/xcodebuild_logs/**/*.log
