workflows:
  taskflow-capacitor-ios-release:
    name: TaskFlow Capacitor iOS Production Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_signing_credentials
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      xcode: latest
      node: 20.18.0
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node dependencies
        script: npm ci
      - name: Sync Capacitor iOS project and CocoaPods
        script: npx cap sync ios
      - name: Fetch App Store signing files
        script: |
          app-store-connect fetch-signing-files com.taskflow.app --type IOS_APP_STORE --create
      - name: Install signing certificate
        script: |
          keychain initialize
          keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build and sign App Store IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log
